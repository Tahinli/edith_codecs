[package]
name = "ec-truehd-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.ec-truehd]
path = ".."

# Keeps this crate out of the main workspace.
[workspace]
members = ["."]

[[bin]]
name = "decode_stream"
path = "fuzz_targets/decode_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_sync"
path = "fuzz_targets/parse_sync.rs"
test = false
doc = false
bench = false
