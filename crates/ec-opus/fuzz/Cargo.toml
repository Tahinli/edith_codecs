[package]
name = "ec-opus-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.ec-opus]
path = ".."

# Keeps this crate out of the main workspace.
[workspace]
members = ["."]

[[bin]]
name = "decode_packet"
path = "fuzz_targets/decode_packet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_toc"
path = "fuzz_targets/parse_toc.rs"
test = false
doc = false
bench = false
