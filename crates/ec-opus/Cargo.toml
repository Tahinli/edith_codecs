[package]
name = "ec-opus"
description = "Opus codec (RFC 6716): SILK+CELT+hybrid+multistream decoder and CELT fullband encoder (mono, stereo, multistream), built on the edith_codecs IR."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
ec-core.workspace = true
ec-dsp.workspace = true
wide.workspace = true
# Optional FFT backend (pure Rust, runtime-detected AVX kernels, no C): the
# family stays dependency-free without it (`--no-default-features`); the
# speed bench pulls it in behind `fft-rustfft`.
rustfft = { version = "6", optional = true, default-features = false }

[dev-dependencies]
ec-dsp.workspace = true
ec-ogg.workspace = true

[features]
default = ["fft-rustfft"]
fft-rustfft = ["dep:rustfft"]
