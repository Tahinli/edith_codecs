[package]
name = "ec-mjpeg-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ec-core = { path = "../../ec-core" }
ec-image = { path = "../../ec-image" }
ec-mjpeg = { path = ".." }

# Kept out of the main workspace: see `exclude` in the root Cargo.toml.
[workspace]
members = ["."]

[[bin]]
name = "decode_mjpeg"
path = "fuzz_targets/decode_mjpeg.rs"
test = false
doc = false
bench = false
