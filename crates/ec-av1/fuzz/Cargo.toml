[package]
name = "ec-av1-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ec-core = { path = "../../ec-core" }
ec-av1 = { path = ".." }
ec-av1-syntax = { path = "../../ec-av1-syntax" }

# Kept out of the main workspace: see `exclude` in the root Cargo.toml.
[workspace]
members = ["."]

[[bin]]
name = "parse_obu"
path = "fuzz_targets/parse_obu.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_stream"
path = "fuzz_targets/decode_stream.rs"
test = false
doc = false
bench = false
