[package]
name = "ec-av1"
description = "AV1 OBU writer — bit-exact inverse of the ec-av1-syntax parsers, for the stateless-decoder subset."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
ec-core.workspace = true
ec-av1-syntax.workspace = true

[features]
default = ["gate-counters"]
# Compiles the ~550 `*_HITS` gate counters (see `src/hits.rs`). ON by default so
# every test gate and the probe's census see the same numbers they always have;
# a shipped decoder can build `--no-default-features` to drop the TLS bump on
# each counted path -- the `*_hits()` accessors still compile and return 0.
gate-counters = []
