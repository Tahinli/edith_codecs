[package]
name = "ec-mpeg4-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ec-core = { path = "../../ec-core" }
ec-mpeg4 = { path = ".." }

# Kept out of the main workspace: see `exclude` in the root Cargo.toml.
[workspace]
members = ["."]

[[bin]]
name = "decode_mpeg4"
path = "fuzz_targets/decode_mpeg4.rs"
test = false
doc = false
bench = false
