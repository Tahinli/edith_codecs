[package]
name = "ec-h264"
description = "H.264 software decoder: I, P and B slices, CAVLC and CABAC, 8-bit 4:2:0 progressive, display-order output"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Internal-only RD experiment switches, compiled only by the measurement harness.
rd-ablation = []

[dependencies]
ec-core = { workspace = true }
ec-h264-syntax = { workspace = true }
wide = { workspace = true }

[dev-dependencies]
# The conformance harness walks Annex B itself to drive push_nal.
ec-h264-syntax = { workspace = true }
# ... and demuxes an MP4 directly where ffmpeg's own Annex B extraction of it
# produces a stream ffmpeg then cannot decode.
ec-mp4 = { workspace = true }
ec-matroska = { workspace = true }
