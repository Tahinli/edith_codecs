[package]
name = "ec-ogg-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.ec-core]
path = "../../ec-core"

[dependencies.ec-ogg]
path = ".."

# Keeps this crate out of the main workspace.
[workspace]
members = ["."]

[[bin]]
name = "page_parse"
path = "fuzz_targets/page_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "demux"
path = "fuzz_targets/demux.rs"
test = false
doc = false
bench = false

[[bin]]
name = "demux_raw"
path = "fuzz_targets/demux_raw.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mapping"
path = "fuzz_targets/mapping.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false
