[workspace]
resolver = "3"
members = ["crates/*", "shims/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Ahmet Kaan Gümüş"]

[workspace.dependencies]
ec-ac3 = { path = "crates/ec-ac3", version = "0.1.0" }
ec-av1-syntax = { path = "crates/ec-av1-syntax", version = "0.1.0" }
ec-core = { path = "crates/ec-core", version = "0.1.0" }
ec-dsp = { path = "crates/ec-dsp", version = "0.1.0" }
ec-h264-syntax = { path = "crates/ec-h264-syntax", version = "0.1.0" }
ec-inflate = { path = "crates/ec-inflate", version = "0.1.0" }
ec-matroska = { path = "crates/ec-matroska", version = "0.1.0" }
ec-mp4 = { path = "crates/ec-mp4", version = "0.1.0" }
ec-riff = { path = "crates/ec-riff", version = "0.1.0" }
ec-vp9-syntax = { path = "crates/ec-vp9-syntax", version = "0.1.0" }
# Portable SIMD without asm or build-time tooling (family rule: pure Rust only).
wide = "1.5"

[profile.release]
opt-level = 3
