[package]
name = "symphonia"
description = "Compatibility shim: the symphonia 0.6 umbrella surface edith consumes, served by ec-probe."
version = "0.6.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Ahmet Kaan Gümüş"]
publish = false

[dependencies]
ec-core = { path = "../../crates/ec-core", version = "0.1.0" }
ec-ogg = { path = "../../crates/ec-ogg", version = "0.1.0" }
ec-probe = { path = "../../crates/ec-probe", version = "0.1.0" }
symphonia-core = { path = "../symphonia-core", version = "0.6.0" }

[dev-dependencies]
symphonia-codec-aac = { path = "../symphonia-codec-aac", version = "0.6.0" }
ec-vorbis = { path = "../../crates/ec-vorbis", version = "0.1.0" }

# The incumbent's feature names, every one of them a no-op: a caller selects
# codecs and containers there, and here `ec_probe` serves all of them
# unconditionally. They are declared because a feature list is part of the
# surface a `[patch.crates-io]` entry has to answer — a consumer naming
# `features = ["mkv"]` fails to resolve otherwise, which is not a difference
# worth making it edit its manifest for.
[features]
aac = []
alac = []
flac = []
id3v1 = []
id3v2 = []
isomp4 = []
mkv = []
mp3 = []
ogg = []
pcm = []
vorbis = []
wav = []
