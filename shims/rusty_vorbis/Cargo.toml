[package]
name = "rusty_vorbis"
description = "Compatibility shim: the rusty_vorbis 0.1.1 surface edith consumes, served by ec-vorbis."
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Ahmet Kaan Gümüş"]
publish = false

[dependencies]
ec-core = { path = "../../crates/ec-core", version = "0.1.0" }
ec-vorbis = { path = "../../crates/ec-vorbis", version = "0.1.0" }

[dev-dependencies]
ec-ogg = { path = "../../crates/ec-ogg", version = "0.1.0" }
