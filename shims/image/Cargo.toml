[package]
name = "image"
description = "Compatibility shim: the image surface edith's engine consumes, served by ec-image."
version = "0.25.10"
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
ec-image = { path = "../../crates/ec-image", version = "0.1.0" }

# The format switches the incumbent gates its decoders behind. Every format this
# shim serves is compiled unconditionally, so these select nothing -- they exist
# because a consumer naming a feature the replacement lacks fails to *resolve*,
# and edith's engine asks for exactly these three.
[features]
png = []
jpeg = []
webp = []

# The surface that exists only because gpui consumes it: animation frames,
# their delays, and the per-format decoder types under `image::codecs`. It is
# not part of decoding a still picture, so a build that draws no windows does
# not compile it -- the way `chrono` keeps its `serde` impls behind a feature.
gpui = []
