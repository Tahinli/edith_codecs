[target.x86_64-unknown-linux-gnu]
# Wrap every test/bin run in scripts/memguard-runner.sh so a runaway
# allocation gets killed inside its own cgroup instead of OOM-killing the
# machine. Located via `git rev-parse --show-toplevel` from the invoker's cwd
# (cargo does not resolve runner paths relative to this file, and an absolute
# path would break other worktree checkouts of this repo). `git bisect run`
# exports GIT_DIR, which would make that rev-parse resolve the test package
# dir instead of the repo. Strip the leaked git vars first.
runner = ["bash", "-c", "root=$(env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE git rev-parse --show-toplevel) && exec \"$root/scripts/memguard-runner.sh\" \"$@\"", "--"]

[env]
# The AV1 rate-target tests keep several frames' worth of encoder state on the
# test thread's stack; the 2 MB default overflows in debug builds (release
# passes). Cap lives in the repo so every checkout and worktree gets it.
RUST_MIN_STACK = "67108864"
