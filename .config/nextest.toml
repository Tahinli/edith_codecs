# [profile.mut]: kill-matrix runs (scripts/kill-matrix.sh heavy mode). A test that hangs under a
# mutant is terminated after 7 x 60 s = 420 s (about 1.6x the slowest heavy test, ~265 s) and nextest
# reports it as TIMEOUT, which the matrix counts as a kill (caught).
[profile.mut]
slow-timeout = { period = "60s", terminate-after = 7 }
